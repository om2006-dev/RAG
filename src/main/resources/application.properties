    spring.application.name=Mamuli_Rag

    spring.config.import=optional:file:.env[.properties]

    spring.ai.model.chat=openai
    spring.ai.model.embedding=ollama

    spring.ai.openai.base-url=https://api.groq.com/openai/v1
    spring.ai.openai.chat.options.model=qwen/qwen3.8-27b
    spring.ai.openai.api-key=${OPENAI_API_KEY}

    spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
    spring.ai.vectorstore.pinecone.index-name=om
    spring.ai.vectorstore.pinecone.namespace=policies

    spring.ai.ollama.base-url=http://localhost:11434
    spring.ai.ollama.embedding.model=nomic-embed-text